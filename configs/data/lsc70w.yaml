# Gramática carpeta/nombre del corpus LSC70W (design §9).
#
# El adapter (src/lsc_data/adapter_lsc70w.py) construye una regex NOMBRADA a
# partir de este archivo. La regex DEBE exponer los grupos nombrados
# signer_id, class_label, repetition_id y frame_index. Si la regex no casa una
# ruta candidata, el adapter FALLA con un mensaje accionable; nunca adivina
# (design §9).
#
# Gramática verificada contra el corpus real LSC70W en disco (DO02): la
# estructura es Per##/CLASE/Per##_CLASE_K.jpg con las clases en MAYÚSCULAS. El
# corpus no declara repeticiones, por lo que repetition_id es opcional y por
# defecto 0 (design §9).

schema_version: lsc.lsc70w.v1
source: LSC70W
source_version: lsc70_v2
subset: LSC70W            # sólo se procesa el subset declarado (design §7.6)

# Grupos nombrados obligatorios: signer_id, class_label, frame_index.
# repetition_id es opcional; si la ruta no lo aporta, se usa default_repetition_id.
#
# CLASE CANÓNICA = carpeta de primer nivel (grupo class_label). El nombre de
# archivo repite el firmante (retro-referencia nombrada (?P=signer_id)) pero NO
# se exige que repita la clase: el corpus real tiene irregularidades en el
# nombre de archivo que NO afectan la clase ni el frame_index:
#   - carpeta BUENAS con archivos Per##_BUENOS_*.jpg (variante ortográfica, 38 firmantes);
#   - doble guion bajo antes del índice: Per##_CLASE__<n>.jpg (6 archivos);
#   - guion bajo final tras el índice: Per##_CLASE_<n>_.jpg (4 archivos).
# El class_id se deriva de la carpeta vía label_map, nunca del nombre de archivo.
# El class token del archivo es [A-Z]+ (sin dígitos), por lo que el frame_index
# (grupo (?P<frame_index>\d+)) nunca es ambiguo.
path_regex: '^(?P<signer_id>Per\d{2})/(?P<class_label>[A-Z]+)/(?P=signer_id)_[A-Z]+_+(?P<frame_index>\d+)_?\.jpg$'
default_repetition_id: 0

# Mapa etiqueta-de-carpeta -> class_id. El ORDEN de class_id es canónico y NO se
# infiere de os.listdir ni alfabéticamente (design §4.1). Fuente de verdad del
# texto: contracts/labels.json.
label_map:
  HOLA: 0
  BUENAS: 1
  DIAS: 2
  TARDES: 3
  NOCHES: 4
  YO: 5
  NOMBRE: 6
  ANNOS: 7
  GUSTAR: 8
  LICOR: 9
