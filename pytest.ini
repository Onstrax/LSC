[pytest]
# Configuración ÚNICA de pytest para todo el repo (unificada en la integración, Acosta).
# `python -m pytest` a secas ejecuta todas las suites. e2e se omite solo si Playwright no está instalado.
markers =
    realmodel: requiere model.keras + .task reales (excluir en CI rápida)
    e2e: pruebas de navegador con Playwright
    slow: pruebas lentas (latencia, sesiones prolongadas)
testpaths =
    tests/contracts
    tests/data
    tests/features
    tests/models
    tests/inference
    tests/app
    tests/e2e
addopts = -ra
