[pytest]
# Configuración local para ejecutar las pruebas del módulo de Juan sin depender
# del pyproject.toml raíz (propiedad de Acosta). Cuando se integre el lock
# compartido, estas marcas se trasladan a [tool.pytest.ini_options] del raíz.
markers =
    realmodel: requiere model.keras + .task reales (excluir en CI rápida)
    e2e: pruebas de navegador con Playwright
    slow: pruebas lentas (latencia, sesiones prolongadas)
testpaths =
    tests/app
    tests/e2e
addopts = -ra
